[project]
name = "llms-playground"
version = "0.1.0"
description = "A playground to experiment with LLM providers via CLIver's AgentCore"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Lin Gao" }]

dependencies = [
    "cliver==0.1.2",
    "python-dotenv>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nest-asyncio>=1.5",
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "llms-playground"
version = "0.1.0"
description = "A playground to experiment with LLM providers via CLIver's AgentCore"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Lin Gao" }]

dependencies = [
    "cliver==0.1.2",
    "python-dotenv>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llms_playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
